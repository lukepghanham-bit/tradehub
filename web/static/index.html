<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Board</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="static/app.css">
</head>
<body>
<main id="app" aria-live="polite">
  <header class="top">
    <div class="title">
      <h1 id="hub">Trade Board</h1>
      <p id="summary" class="summary">Connecting to Discord…</p>
    </div>
    <div class="live" id="live" hidden><span class="pulse" aria-hidden="true"></span><span id="updated">Live</span></div>
  </header>

  <nav class="filters" id="filters" aria-label="Filter by analyst"></nav>

  <section id="open-list" class="list" aria-label="Open trades"></section>

  <section id="pending-wrap" hidden>
    <h2 class="section-h">Waiting for entry</h2>
    <div id="pending-list" class="list"></div>
  </section>

  <p id="empty" class="empty" hidden></p>
</main>

<aside id="detail" class="detail" hidden aria-modal="true" role="dialog" aria-labelledby="d-title">
  <div class="detail-inner">
    <button class="close" id="close" aria-label="Close trade details">✕</button>
    <div id="detail-body"></div>
  </div>
</aside>

<script type="module" src="static/app.js"></script>
</body>
</html>
